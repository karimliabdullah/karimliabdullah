    .l { transform: translateX(-6px); }
    @keyframes in { to { opacity: 1; transform: none; } }
    .type { animation: type 900ms steps(24) 150ms both; }
    @keyframes type { from { width: 0; } to { width: 203px; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .r, .l, .type { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
