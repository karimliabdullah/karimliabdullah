name: Build ASCII portrait

# Upload assets/photo.jpg (or .png) on github.com and this regenerates the
# ASCII portrait inside every hero SVG, then commits the result.
on:
  push:
    paths:
      - "assets/photo.*"
      - "scripts/build_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_assets.py
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/face.txt
          git diff --cached --quiet || git commit -m "Rebuild ASCII portrait"
          git push
